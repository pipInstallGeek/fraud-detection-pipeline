# =============================================================================
# Fraud Detection Pipeline - Prometheus Configuration
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # PostgreSQL Exporter
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Apache Kafka Exporter (Topics, Partitions, Consumer Group Lags)
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Lakehouse Pipeline Telemetry Exporter (Bronze/Silver/Gold counts, Debezium, Model stats)
  - job_name: "pipeline-telemetry"
    scrape_interval: 10s
    static_configs:
      - targets: ["pipeline-telemetry:8008"]

  # MinIO Cluster Metrics
  - job_name: "minio"
    metrics_path: "/minio/v2/metrics/cluster"
    scheme: "http"
    static_configs:
      - targets: ["minio:9000"]
