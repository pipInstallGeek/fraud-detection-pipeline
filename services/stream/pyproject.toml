[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-service"
version = "0.1.0"
description = "Autonomous transaction stream service for Fraud Detection Pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "six>=1.16.0",
    "kaggle>=1.5.0",
    "rich>=13.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
